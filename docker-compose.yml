# One command to run everything:   docker compose up --build
# Website + API: http://localhost:5000      MongoDB data is kept in the "mongo-data" volume.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"   # only this computer can reach the database

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/z2a
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set true when you put https in front of it

volumes:
  mongo-data:
